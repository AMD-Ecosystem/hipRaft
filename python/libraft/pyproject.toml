[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.10.0",
    "cmake>=3.30",
    "ninja",
    # The cmake configure resolves these through their `cmake.prefix` entry points.
    "amd-libhipmm==5.*",
    "amd-libhipucxx==0.2.*",
    "amd-rocmds-logger==2.0.*",
]

[project]
name = "amd-libraft"
dynamic = ["version"]
description = "hipRAFT: Reusable Algorithms Functions and other Tools (C++)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/AMD-Ecosystem/hipRaft"
Documentation = "https://rocm.docs.amd.com/projects/hipRaft/en/latest/"
"Issue Tracker" = "https://github.com/AMD-Ecosystem/hipRaft/issues"

[project.entry-points."cmake.prefix"]
libraft = "libraft"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = [
    "libraft",
]

[tool.ruff.lint.isort.sections]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
cmake.args = ["-DCMAKE_CXX_COMPILER=hipcc"]
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.install-dir = "libraft"
wheel.packages = ["libraft"]
wheel.py-api = "py3"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libraft/VERSION"
regex = "(?P<value>.*)"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep these as small as possible
max_allowed_size_compressed = '25Mi'
