[build-system]

build-backend = "scikit_build_core.build"
requires = [
    "cython>=3.2.2",
    "scikit-build-core[pyproject]>=0.10.0",
    "amd-libhipmm==5.*",
    "amd-hipmm==5.*"
]

[project]
name = "amd-pylibraft"
dynamic = ["version"]
description = "hipRAFT: Reusable Algorithms Functions and other Tools"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "amd-libraft==2.0.*",
    "numpy>=1.23,<3.0a0",
    "amd_hipmm==5.*",
    # NOTE(HIP/AMD): AMD substitutes upstream `cuda-python` with the AMD pair
    # `rocm-bindings-hip` + `hip-python-interop` (the latter exposes a `cuda.*`
    # namespace backed by HIP).
    "hip-python-interop>=7.2.3",
    "rocm-bindings-hip>=7.2.3",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "amd-cupy==13.5.1",
    "pytest",
    "pytest-cov",
    "scikit-learn",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/ROCm-DS/hipRaft"
Documentation = "https://rocm.docs.amd.com/projects/hipRaft/en/latest/"
"Issue Tracker" = "https://github.com/ROCm-DS/hipRaft/issues"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = [
    "pylibraft",
]

[tool.ruff.lint.isort.sections]
dask = [
    "dask",
    "distributed",
    "dask_cuda",
]
rapids = [
    "rmm",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
cmake.args = ["-DCMAKE_CXX_COMPILER=hipcc"]
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["pylibraft"]
wheel.py-api = "cp311" # overridden in CI builds by arguments from `ci/build_wheel_*.sh` scripts.

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "pylibraft/VERSION"
regex = "(?P<value>.*)"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep these as small as possible
max_allowed_size_compressed = '2Mi'

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:.*cuda..* module is deprecated.*:DeprecationWarning",
]
