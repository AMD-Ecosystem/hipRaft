[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.10.0",
]

[project]
name = "amd-raft-dask"
dynamic = ["version"]
description = "Reusable Accelerated Functions & Tools Dask Infrastructure"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "Apache-2.0 AND MIT" }
requires-python = ">=3.10"
dependencies = [
    "dask-cuda==26.2.*,>=0.0.0a0",
    "distributed-ucxx==0.48.*,>=0.0.0a0",
    "libraft==26.2.*,>=0.0.0a0",
    "pylibraft==26.2.*,>=0.0.0a0",
    "rapids-dask-dependency==26.2.*,>=0.0.0a0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    "pytest-cov",
    "pytest<9.0.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://github.com/ROCm-DS/hipRaft"
Documentation = "https://rocm.docs.amd.com/projects/hipRaft/en/latest/"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = [
    "raft_dask",
]

[tool.ruff.lint.isort.sections]
dask = [
    "dask",
    "distributed",
    "dask_cuda",
]
rapids = [
    "pylibraft",
    "rmm",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["raft_dask"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "raft_dask/VERSION"
regex = "(?P<value>.*)"

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
requires = [
    "cmake>=3.30.4",
    "cython>=3.0.0,<3.2.0",
    "libraft==26.2.*,>=0.0.0a0",
    "librmm==26.2.*,>=0.0.0a0",
    "libucx>=1.19.0,<1.19.1",
    "ninja",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '2M'
