# Overlay for raft-dask dependencies.
# Apply on top of the base environment:
#   conda env create -f all_rocm_arch-x86_64.yaml
#   conda env update -n all_rocm_arch-x86_64 -f raft_dask_overlay_rocm_arch-x86_64.yaml

channels:
- conda-forge
dependencies:
- dask
- distributed
- pytest-timeout
- pip:
  - --extra-index-url https://pypi.amd.com/rocm-7.2.3/simple/
  - amd-dask-hip==1.0.*
  - amd-libhipucxx==0.1.*
  - amd-hipucxx==0.1.*
  - amd-distributed-hipucxx==0.1.*
  - amd-libraft==1.0.*
  - amd-pylibraft==1.0.*
  - amd-raft-dask==1.0.*

name: all_rocm_arch-x86_64
